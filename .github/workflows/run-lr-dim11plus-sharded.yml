name: Guarded sharded exhaustive size-30 LR dimension-11-plus search

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Stop if a lower-dimensional exact release found a negative
        id: gate
        run: |
          python - <<'PY'
          import json,urllib.request
          urls=[
            'https://github.com/zach7036/c4-star-ramsey/releases/download/lr-dim34-top7-v1/dim34_summary.json',
            'https://github.com/zach7036/c4-star-ramsey/releases/download/lr-lowdim-exhaustive-v1/lowdim_summary.json',
            'https://github.com/zach7036/c4-star-ramsey/releases/download/lr-dim8-exhaustive-v1/dim8_summary.json',
            'https://github.com/zach7036/c4-star-ramsey/releases/download/lr-dim9-exhaustive-v1/dim9_combined_summary.json',
            'https://github.com/zach7036/c4-star-ramsey/releases/download/lr-dim10-exhaustive-v1/dim10_combined_summary.json']
          hit=False
          for u in urls:
            try: hit |= int(json.load(urllib.request.urlopen(u,timeout=20)).get('negative_hits',0))>0
            except Exception: pass
          open('/tmp/gate','w').write('true' if hit else 'false')
          PY
          echo "skip=$(cat /tmp/gate)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.skip != 'true'
        run: git clone --depth 1 https://github.com/PerAlexandersson/lrcalc-rs.git source
      - name: Add exact sharded high-dimension driver
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p source/src/bin
          cat > source/src/bin/dim11plus_shard.rs <<'RS'
          use std::env;use std::fs::File;use std::io::{BufWriter,Write};
          use lrcalc::schur::schur_product_expansion;use lrcalc::lr_ehrhart::{lr_stretch_dimension,lr_stretch_h_vector};
          use num_rational::BigRational;use num_traits::{Zero,Signed};
          fn gp(n:i32,l:usize,m:i32,p:&mut Vec<i32>,o:&mut Vec<Vec<i32>>){if n==0{o.push(p.clone());return}if l==0{return}for x in(1..=m.min(n)).rev(){p.push(x);gp(n-x,l-1,x,p,o);p.pop();}}
          fn ps(n:i32)->Vec<Vec<i32>>{let mut o=vec![];gp(n,7,n,&mut vec![],&mut o);o}fn f(p:&[i32])->String{p.iter().map(|x|x.to_string()).collect::<Vec<_>>().join(",")}
          fn mix(mut x:u64)->u64{x^=x>>33;x=x.wrapping_mul(0xff51afd7ed558ccd);x^=x>>33;x=x.wrapping_mul(0xc4ceb9fe1a85ec53);x^(x>>33)}
          fn h(a:&[i32],b:&[i32],c:&[i32])->u64{let mut z=0xcbf29ce484222325;for p in[a,b,c]{for&x in p{z=mix(z^(x as u64+0x9e3779b97f4a7c15));}z=mix(z^255);}z}
          fn main(){let shard:usize=env::var("SHARD").unwrap().parse().unwrap();let mut b=vec![];for n in 0..=30{b.push(ps(n));}
            let mut support=0u64;let mut counts=[0u64;16];let mut assigned=0u64;let mut complete=0u64;let mut failed=0u64;let mut hits=0u64;
            let mut neg=BufWriter::new(File::create(format!("dim11plus_negative_{shard}.tsv")).unwrap());let mut err=BufWriter::new(File::create(format!("dim11plus_errors_{shard}.tsv")).unwrap());let mut close:Vec<(BigRational,String)>=vec![];
            for a in 0usize..=15{let z=30-a;for l in&b[a]{for r in&b[z]{if a==z&&l>r{continue}let ts=match schur_product_expansion(l,r,7,-1){Ok(x)=>x,Err(_)=>continue};for t in ts{if t.coefficient<3||t.partition.len()>7{continue}support+=1;
              let d=match lr_stretch_dimension(&t.partition,l,r){Ok(Some(x))=>x,_=>continue};if d<11{continue}if d<16{counts[d]+=1}if h(&t.partition,l,r)%8!=shard as u64{continue}assigned+=1;
              match lr_stretch_h_vector(&t.partition,l,r){Err(e)=>{failed+=1;writeln!(err,"{}\t{}\t{}\t{}\t{:?}",f(&t.partition),f(l),f(r),d,e).unwrap();},Ok(p)=>{complete+=1;let cs=p.coefficients.iter().map(|x|x.to_string()).collect::<Vec<_>>().join(",");let mut any=false;for(k,c)in p.coefficients.iter().enumerate(){if c<&BigRational::zero(){any=true;writeln!(neg,"{}\t{}\t{}\t{}\t{}\t{}\t{}",f(&t.partition),f(l),f(r),d,k,c,cs).unwrap();}}if any{hits+=1}let norm=p.coefficients.iter().fold(BigRational::zero(),|q,x|q+x.abs());if d>=5{for k in 1..=d-4{let q=p.coefficients[k].clone()/norm.clone();close.push((q,format!("{}\t{}\t{}\t{}\t{}\t{}\t{}",f(&t.partition),f(l),f(r),d,t.coefficient,k,p.coefficients[k]));}}if close.len()>10000{close.sort_by(|x,y|x.0.cmp(&y.0));close.truncate(2000);}}}
            }}}}
            close.sort_by(|x,y|x.0.cmp(&y.0));close.truncate(2000);let mut c=BufWriter::new(File::create(format!("dim11plus_closest_{shard}.tsv")).unwrap());for(q,s)in close{writeln!(c,"{}\t{}",q,s).unwrap();}
            let mut s=BufWriter::new(File::create(format!("dim11plus_summary_{shard}.json")).unwrap());writeln!(s,"{{\"shard\":{},\"support\":{},\"d11\":{},\"d12\":{},\"d13\":{},\"d14\":{},\"d15\":{},\"assigned\":{},\"completed\":{},\"failed\":{},\"negative_hits\":{}}}",shard,support,counts[11],counts[12],counts[13],counts[14],counts[15],assigned,complete,failed,hits).unwrap();}
          RS
      - if: steps.gate.outputs.skip != 'true'
        working-directory: source
        run: cargo build --release --bin dim11plus_shard
      - name: Run shard
        if: steps.gate.outputs.skip != 'true'
        working-directory: source
        env:
          SHARD: ${{ matrix.shard }}
        run: ./target/release/dim11plus_shard
      - name: Package shard
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir artifact
          cp source/dim11plus_*_${{ matrix.shard }}.* artifact/
          cp source/src/bin/dim11plus_shard.rs artifact/
          gzip -9 artifact/dim11plus_closest_${{ matrix.shard }}.tsv
          sha256sum artifact/* > artifact/SHA256SUMS_${{ matrix.shard }}
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dim11plus-shard-${{ matrix.shard }}
          path: artifact/
          retention-days: 1

  combine:
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dim11plus-shard-*
          path: shards
          merge-multiple: true
        continue-on-error: true
      - name: Combine and publish
        run: |
          mkdir release
          cp shards/dim11plus_summary_*.json release/ 2>/dev/null || true
          cat shards/dim11plus_negative_*.tsv > release/dim11plus_negative.tsv 2>/dev/null || true
          cat shards/dim11plus_errors_*.tsv > release/dim11plus_errors.tsv 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          for p in Path('release').glob('dim11plus_summary_*.json'):
              try: rows.append(json.loads(p.read_text()))
              except: pass
          keys=['d11','d12','d13','d14','d15']
          out={'shards_received':len(rows),'assigned':sum(x.get('assigned',0) for x in rows),'completed':sum(x.get('completed',0) for x in rows),'failed':sum(x.get('failed',0) for x in rows),'negative_hits':sum(x.get('negative_hits',0) for x in rows)}
          for k in keys: out[k]=max([x.get(k,0) for x in rows] or [0])
          Path('release/dim11plus_combined_summary.json').write_text(json.dumps(out,indent=2))
          PY
          sha256sum release/* > release/SHA256SUMS
          gh release delete lr-dim11plus-exhaustive-v1 --repo "$GITHUB_REPOSITORY" --yes || true
          git push origin :refs/tags/lr-dim11plus-exhaustive-v1 || true
          gh release create lr-dim11plus-exhaustive-v1 release/* --repo "$GITHUB_REPOSITORY" --title "Guarded complete LR dimension-11-plus search" --notes "Exact sharded size-30 census; hard cases listed separately."
      - uses: actions/upload-artifact@v4
        with:
          name: exact-lr-dim11plus-combined
          path: release/
          retention-days: 1
