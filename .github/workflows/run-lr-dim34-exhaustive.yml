name: Exhaust all size-30 LR polynomials of dimensions 3-4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  dim34:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - run: git clone --depth 1 https://github.com/PerAlexandersson/lrcalc-rs.git source
      - name: Add exact dimension-3/4 driver
        run: |
          mkdir -p source/src/bin
          cat > source/src/bin/dim34.rs <<'RS'
          use std::fs::File;use std::io::{BufWriter,Write};
          use lrcalc::schur::schur_product_expansion;
          use lrcalc::lr_ehrhart::{lr_stretch_dimension,lr_stretch_h_vector};
          use num_traits::{Zero,Signed};use num_rational::BigRational;
          fn gp(n:i32,l:usize,m:i32,p:&mut Vec<i32>,o:&mut Vec<Vec<i32>>){if n==0{o.push(p.clone());return}if l==0{return}for x in(1..=m.min(n)).rev(){p.push(x);gp(n-x,l-1,x,p,o);p.pop();}}
          fn ps(n:i32)->Vec<Vec<i32>>{let mut o=vec![];gp(n,7,n,&mut vec![],&mut o);o}
          fn f(p:&[i32])->String{p.iter().map(|x|x.to_string()).collect::<Vec<_>>().join(",")}
          fn main(){let mut b=vec![];for n in 0..=30{b.push(ps(n));}
            let mut support=0u64;let mut d3=0u64;let mut d4=0u64;let mut done=0u64;let mut fail=0u64;let mut hits=0u64;
            let mut neg=BufWriter::new(File::create("dim34_negative.tsv").unwrap());
            let mut all=BufWriter::new(File::create("dim34_all.tsv").unwrap());
            writeln!(all,"outer\tleft\tright\tdimension\tp1\thstar\tcoefficients").unwrap();
            let mut closest:Vec<(BigRational,String)>=vec![];
            for a in 0usize..=15{let z=30-a;for l in&b[a]{for r in&b[z]{if a==z&&l>r{continue}
              let ts=match schur_product_expansion(l,r,7,-1){Ok(x)=>x,Err(_)=>continue};
              for t in ts{if t.coefficient<3||t.partition.len()>7{continue}support+=1;
                let d=match lr_stretch_dimension(&t.partition,l,r){Ok(Some(x))=>x,_=>continue};if d!=3&&d!=4{continue}if d==3{d3+=1}else{d4+=1}
                let p=match lr_stretch_h_vector(&t.partition,l,r){Ok(x)=>x,Err(_)=>{fail+=1;continue}};done+=1;
                let hs=p.h_vector.iter().map(|x|x.to_string()).collect::<Vec<_>>().join(",");let cs=p.coefficients.iter().map(|x|x.to_string()).collect::<Vec<_>>().join(",");
                writeln!(all,"{}\t{}\t{}\t{}\t{}\t{}\t{}",f(&t.partition),f(l),f(r),d,t.coefficient,hs,cs).unwrap();
                let mut any=false;for(k,c)in p.coefficients.iter().enumerate(){if c<&BigRational::zero(){any=true;writeln!(neg,"{}\t{}\t{}\t{}\t{}\t{}\t{}",f(&t.partition),f(l),f(r),d,k,c,cs).unwrap();}}
                if any{hits+=1}
                let norm=p.coefficients.iter().fold(BigRational::zero(),|q,x|q+x.abs());for k in 1..d{let q=p.coefficients[k].clone()/norm.clone();closest.push((q,format!("{}\t{}\t{}\t{}\t{}\t{}",f(&t.partition),f(l),f(r),d,k,p.coefficients[k])));}
                if closest.len()>10000{closest.sort_by(|x,y|x.0.cmp(&y.0));closest.truncate(2000);}
              }
            }}}
            closest.sort_by(|x,y|x.0.cmp(&y.0));closest.truncate(2000);let mut c=BufWriter::new(File::create("dim34_closest.tsv").unwrap());for(q,s)in closest{writeln!(c,"{}\t{}",q,s).unwrap();}
            let mut s=BufWriter::new(File::create("dim34_summary.json").unwrap());writeln!(s,"{{\"support\":{},\"dimension3\":{},\"dimension4\":{},\"completed\":{},\"failed\":{},\"negative_hits\":{}}}",support,d3,d4,done,fail,hits).unwrap();
          }
          RS
      - working-directory: source
        run: cargo build --release --bin dim34
      - working-directory: source
        run: ./target/release/dim34
      - name: Publish
        run: |
          mkdir artifact
          cp source/dim34_* artifact/
          cp source/src/bin/dim34.rs artifact/
          gzip -9 artifact/dim34_all.tsv artifact/dim34_closest.tsv
          sha256sum artifact/* > artifact/SHA256SUMS
          gh release delete lr-dim34-exhaustive-v1 --repo "$GITHUB_REPOSITORY" --yes || true
          git push origin :refs/tags/lr-dim34-exhaustive-v1 || true
          gh release create lr-dim34-exhaustive-v1 artifact/* --repo "$GITHUB_REPOSITORY" --title "Complete LR dimension 3-4 search" --notes "Exact exhaustive size-30 search."
      - uses: actions/upload-artifact@v4
        with:
          name: exact-lr-dim34
          path: artifact/
          retention-days: 1
