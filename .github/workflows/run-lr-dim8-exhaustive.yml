name: Exhaust all size-30 LR polynomials of dimension 8

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  dim8:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - run: git clone --depth 1 https://github.com/PerAlexandersson/lrcalc-rs.git source
      - name: Add exact dimension-8 driver
        run: |
          mkdir -p source/src/bin
          cat > source/src/bin/dim8.rs <<'RS'
          use std::fs::File;use std::io::{BufWriter,Write};use lrcalc::schur::schur_product_expansion;use lrcalc::lr_ehrhart::{lr_stretch_dimension,lr_stretch_h_vector};use num_traits::{Zero,Signed};use num_rational::BigRational;
          fn gp(n:i32,l:usize,m:i32,p:&mut Vec<i32>,o:&mut Vec<Vec<i32>>){if n==0{o.push(p.clone());return}if l==0{return}for x in(1..=m.min(n)).rev(){p.push(x);gp(n-x,l-1,x,p,o);p.pop();}}fn ps(n:i32)->Vec<Vec<i32>>{let mut o=vec![];gp(n,7,n,&mut vec![],&mut o);o}fn f(p:&[i32])->String{p.iter().map(|x|x.to_string()).collect::<Vec<_>>().join(",")}
          fn main(){let mut b=vec![];for n in 0..=30{b.push(ps(n));}let mut support=0u64;let mut tested=0u64;let mut failed=0u64;let mut nh=0u64;let mut neg=BufWriter::new(File::create("dim8_negative.tsv").unwrap());let mut close:Vec<(BigRational,String)>=vec![];
          for a in 0usize..=15{let z=30-a;for l in&b[a]{for r in&b[z]{if a==z&&l>r{continue}let ts=match schur_product_expansion(l,r,7,-1){Ok(x)=>x,Err(_)=>continue};for t in ts{if t.coefficient<3||t.partition.len()>7{continue}support+=1;let d=match lr_stretch_dimension(&t.partition,l,r){Ok(Some(x))=>x,_=>continue};if d!=8{continue}tested+=1;let p=match lr_stretch_h_vector(&t.partition,l,r){Ok(x)=>x,Err(_)=>{failed+=1;continue}};let mut any=false;for(k,c)in p.coefficients.iter().enumerate(){if c<&BigRational::zero(){any=true;writeln!(neg,"{}\t{}\t{}\t{}\t{}",f(&t.partition),f(l),f(r),k,c).unwrap();}}if any{nh+=1}let norm=p.coefficients.iter().fold(BigRational::zero(),|q,x|q+x.abs());for k in 1..=4{let q=p.coefficients[k].clone()/norm.clone();close.push((q,format!("{}\t{}\t{}\t{}\t{}\t{}",f(&t.partition),f(l),f(r),t.coefficient,k,p.coefficients[k])));}if close.len()>10000{close.sort_by(|x,y|x.0.cmp(&y.0));close.truncate(2000);}}}}}
          close.sort_by(|x,y|x.0.cmp(&y.0));close.truncate(2000);let mut c=BufWriter::new(File::create("dim8_closest.tsv").unwrap());for(q,s)in close{writeln!(c,"{}\t{}",q,s).unwrap();}let mut s=BufWriter::new(File::create("dim8_summary.json").unwrap());writeln!(s,"{{\"support\":{},\"dimension8\":{},\"completed\":{},\"failed\":{},\"negative_hits\":{}}}",support,tested,tested-failed,failed,nh).unwrap();}
          RS
      - working-directory: source
        run: cargo build --release --bin dim8
      - working-directory: source
        run: ./target/release/dim8
      - name: Publish
        run: |
          mkdir artifact
          cp source/dim8_* artifact/
          cp source/src/bin/dim8.rs artifact/
          gzip -9 artifact/dim8_closest.tsv
          sha256sum artifact/* > artifact/SHA256SUMS
          gh release delete lr-dim8-exhaustive-v1 --repo "$GITHUB_REPOSITORY" --yes || true
          git push origin :refs/tags/lr-dim8-exhaustive-v1 || true
          gh release create lr-dim8-exhaustive-v1 artifact/* --repo "$GITHUB_REPOSITORY" --title "Complete LR dimension-8 search" --notes "Exact exhaustive size-30 search."
      - uses: actions/upload-artifact@v4
        with:
          name: exact-lr-dim8
          path: artifact/
          retention-days: 1
